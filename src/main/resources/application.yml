spring:
  application:
    name: CarRentalSystem

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/CarRentalSystem}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-car-rental-system-which-is-long-enough}
  expiration: ${JWT_EXPIRATION:3600000}

