                $ref: "#/components/schemas/UserResponse"
      security:
      - bearerAuth: []
  /api/v1/reviews/{id}:
    get:
      tags:
      - Reviews
      summary: Get review by ID
      description: Returns a review by its ID
      operationId: getById_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Review successfully retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "404":
          description: Review not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Reviews
      summary: Delete review
      description: Deletes a review. Available to the review author or administrators
      operationId: delete_4
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Review successfully deleted
        "403":
          description: Access denied
        "404":
          description: Review not found
      security:
      - bearerAuth: []
  /api/v1/reviews/car/{carId}:
    get:
      tags:
      - Reviews
      summary: Get reviews by car ID
      description: Returns all reviews for the specified car
      operationId: getByCarId
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Reviews successfully retrieved
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewResponse"
        "404":
          description: Car not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewResponse"
      security:
      - bearerAuth: []
  /api/v1/payments/{id}:
    get:
      tags:
      - Payments
      summary: Get payment by ID
      description: Returns a payment by its ID. Available to the payment owner
      operationId: getById_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Payment successfully retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "403":
          description: Access denied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Payment not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
      security:
      - bearerAuth: []
  /api/v1/bookings/{id}:
    get:
      tags:
      - Bookings
      summary: Get bookings by id
      description: Returns booking by id. Available only to administrators
      operationId: getById_6
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Booking successfully retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "403":
