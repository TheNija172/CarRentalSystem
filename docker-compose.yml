services:
  postgres:
    image: postgres:16
    container_name: CarRentalSystemPostgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: CarRentalSystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CarRentalSystem"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: